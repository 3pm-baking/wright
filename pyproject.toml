[project]
name = "wright"
version = "0.1.0"
description = "Multi-domain Python library for bill-of-materials planning, recipe costing, shopping list aggregation, unit conversion, allergen detection, and nutrition analysis. Works for food recipes, construction, brewing, and manufacturing."
readme = "README.md"
authors = [
    { name = "Will Dean", email = "will@germanbakingasheville.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pint>=0.25",
    "pydantic>=2.8.2,<3.0.0",
    "pyyaml>=6.0.3",
]
keywords = [
    "bill-of-materials",
    "bom",
    "construction",
    "manufacturing",
    "batch-production",
    "planning",
    "costing",
    "pricing",
    "production",
    "procurement",
    "recipe",
    "supply-chain",
    "unit-conversion",
    "shopping-list",
    "allergen-detection",
    "nutrition",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/3pm-baking/wright"
Issues = "https://github.com/3pm-baking/wright/issues"
Documentation = "https://wright.germanbakingasheville.com"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
extend-include = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B", "C4", "SIM"]
ignore = ["D105", "D107", "D203", "D212", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "E501"]
"examples/**/*.py" = ["D", "E501"]

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
source = ["src/wright"]
omit = ["tests/*", "docs/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "def __repr__",
    "class .*\\bProtocol\\):",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mkdocs-material[imaging]>=9.6.0",
    "mkdocstrings-python>=2.0.4",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.0",
    "ruff>=0.15.17",
    "ty>=0.0.50",
    "zensical>=0.0.45",
]
