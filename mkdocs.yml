site_name: wright
site_description: Multi-domain Python library for bill-of-materials planning, recipe costing, shopping list generation, unit conversion, allergen detection, and nutrition analysis. Works for food, construction, brewing, and manufacturing.
site_url: http://wright.germanbakingasheville.com
repo_url: https://github.com/3pm-baking/wright
theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/3pm-baking/wright

extra_templates:
  - robots.txt

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            inherited_members: true
  - search

nav:
  - Introduction: index.md
  - Getting Started: guides/getting-started.md
  - Core Concepts:
      - Models: guides/core/models.md
      - Costing & Pricing: guides/core/costing.md
      - Matching & Planning: guides/core/planning.md
      - Allergens & Nutrition: guides/core/allergens-nutrition.md
  - Guides:
      - Meal Prep: guides/meal-prep.md
      - Food Service: guides/restaurant.md
      - Beyond Food: guides/domains.md
      - Customization: guides/customization.md
  - API Reference: api.md
